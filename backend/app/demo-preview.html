<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Small steps — demo habit tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ed;color:#253d35;font:16px system-ui,sans-serif;padding:42px 22px}.app{max-width:540px;margin:auto}.tag{font:11px monospace;text-transform:uppercase;letter-spacing:2px;color:#62766a}h1{font:48px Georgia,serif;font-weight:normal;margin:22px 0 10px}.muted{color:#77827b;font-size:14px}.habit{display:flex;align-items:center;gap:14px;border-bottom:1px solid #dedfd4;padding:22px 4px}.habit input{width:24px;height:24px;accent-color:#427458}.habit input:checked+span{text-decoration:line-through;color:#8e9c8e}form{display:flex;gap:10px;margin-top:28px}input[type=text]{min-width:0;flex:1;border:1px solid #d4d8ce;border-radius:8px;padding:12px;background:#fff;font:inherit}button{background:#2f5b47;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit;cursor:pointer}.note{margin-top:34px;border-top:1px solid #dedfd4;padding-top:16px;font-size:12px;line-height:1.6;color:#77827b}
</style><main class="app"><div class="tag">Prebuilt demo fixture · not a Claude Code build</div><h1>Small steps, every day.</h1><p class="muted" id="date"></p><div id="habits"></div><form id="add"><input id="name" aria-label="New habit" placeholder="A new small habit…" maxlength="100" required><button>Add habit</button></form><p class="note">This fixture demonstrates the handoff preview. It does not implement your compiled spec or sync across devices. Storage is disabled in the sandboxed preview; download the HTML to try browser-local saving.</p></main>
<script>
const key='prompt-caller-demo-habits';let habits=[{name:'Drink a glass of water',done:true},{name:'Read for 15 minutes',done:false},{name:'Take a walk outside',done:false}];try{habits=JSON.parse(localStorage.getItem(key))||habits}catch{}
document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function draw(){const root=document.getElementById('habits');root.replaceChildren();habits.forEach((habit,i)=>{const row=document.createElement('label');row.className='habit';const input=document.createElement('input');input.type='checkbox';input.checked=habit.done;input.onchange=()=>{habits[i].done=input.checked;save();draw()};const name=document.createElement('span');name.textContent=habit.name;row.append(input,name);root.append(row)})}
function save(){try{localStorage.setItem(key,JSON.stringify(habits))}catch{}}
document.getElementById('add').onsubmit=e=>{e.preventDefault();const field=document.getElementById('name');if(field.value.trim()){habits.push({name:field.value.trim(),done:false});field.value='';save();draw()}};draw();
</script></html>
